<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function so_nguyen_to(num) {
           if (num < 2) {
                return false;
            }
           let count = 0
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) {
                    count++;
                }
            }
            return count === 0;
        }
        console.log(so_nguyen_to(8));
    </script>
</body>
</html>
